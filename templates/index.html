<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG UC FREE</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: url('https://i.imgur.com/8QjZ3yL.jpg') no-repeat center/cover;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
}

.card {
  background: rgba(8, 12, 24, 0.88);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 24px;
  padding: 40px 30px;
  width: 400px;
  text-align: center;
  color: white;
}

.logo h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  letter-spacing: 3px;
  color: #EAEAEA;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.badge {
  background: #FFB800;
  color: #000;
  font-weight: 700;
  font-size: 24px;
  padding: 4px 20px;
  border-radius: 6px;
  display: inline-block;
  margin-top: -10px;
}

.uc-icon {
  margin: 15px 0;
  font-weight: 700;
  border: 2px solid #FFB800;
  border-radius: 8px;
  padding: 2px 12px;
  display: inline-block;
  color: #FFB800;
}

h2 { font-size: 24px; margin: 20px 0 8px; }
.subtitle { color: #A0A0A0; font-size: 14px; margin-bottom: 20px; }

.divider { 
  display: flex; align-items: center; color: #FFB800; 
  font-weight: 600; margin: 20px 0; 
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.2);
}
.divider span { padding: 0 10px; }

.btn {
  width: 100%; padding: 14px; border-radius: 12px; border: none;
  font-size: 16px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 12px; transition: 0.2s;
}
.btn:hover { transform: scale(1.02); }

.btn-google { background: white; color: #333; }
.btn-fb { background: #1877F2; color: white; }

.icon { width: 22px; height: 22px; }

.shield { color: #FFB800; margin: 20px 0 8px; }
.note { color: #A0A0A0; font-size: 13px; }

.signup { margin-top: 20px; color: #A0A0A0; font-size: 14px; }
.signup a { color: #FFB800; text-decoration: none; font-weight: 600; }

.footer {
  margin-top: 25px; color: #A0A0A0; font-size: 12px;
  display: flex; justify-content: center; gap: 8px;
}
</style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <h1>PUBG</h1>
      <div class="badge">UC FREE</div>
      <div class="uc-icon">UC</div>
    </div>

    <h2>Welcome Back!</h2>
    <p class="subtitle">Login to continue to your account</p>

    <div class="divider"><span>OR</span></div>

    <button class="btn btn-google">
      <img src="https://www.google.com/favicon.ico" class="icon"> Continue with Google
    </button>

    <button class="btn btn-fb">
      <svg class="icon" fill="white" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg>
      Continue with Facebook
    </button>

    <div class="shield">🛡️</div>
    <p class="note">We never post without your permission</p>

    <p class="signup">Don’t have an account? <a href="#">Sign up</a></p>

    <div class="footer">
      🔒 Secure • Fast • 100% Free
    </div>
  </div>

</body>
</html>
